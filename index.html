<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>にょろにょろイライラ蛇 v1.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1322;color:#fff;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}#hud{width:min(100%,540px);display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px;font-weight:800;text-shadow:0 2px 8px #0009}#score{font-size:29px}#best{font-size:13px;text-align:right;line-height:1.6;color:#cbd5e1}#panel{pointer-events:auto;margin:auto 20px;background:#101b2eea;border:1px solid #53678488;border-radius:25px;box-shadow:0 18px 80px #0009;padding:28px 23px;text-align:center;width:min(410px,calc(100% - 40px));backdrop-filter:blur(14px)}h1{font-size:clamp(23px,6vw,31px);margin:3px 0 12px;line-height:1.3}p{color:#cbd5e1;font-size:14px;line-height:1.8}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 22px;font-weight:800;color:#101b2e;background:#67e8f9;min-height:49px}button:active{transform:scale(.97)}.modes{display:flex;gap:10px;margin:23px 0 20px}.modes button{flex:1;background:#26364c;color:#d5e4f5;border:2px solid transparent}.modes button.selected{border-color:#67e8f9;background:#16485b;color:white}#start{width:100%;background:#fbbf24;font-size:19px}#hint{position:absolute;bottom:20px;font-size:12px;color:#d5e4f5a8;text-align:center;padding:0 15px}#result{font-size:35px;font-weight:900;color:#fbbf24;margin:12px 0}#modeTag{color:#67e8f9;font-weight:800;font-size:13px;letter-spacing:.12em}#panel[hidden],#hint[hidden]{display:none}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="hud"><div id="score">0 m</div><div id="best">BEST<br>0 m</div></div><div id="panel"><div id="modeTag">ONE TAP ACTION</div><h1 id="title">にょろにょろ<br>イライラ蛇</h1><p id="desc">タップするたびにポンッと上昇！<br>月面のようにふわっと落下。壁に触れず、どこまで進める？</p><div class="modes" id="modes"><button id="easy" class="selected">EASY<br><small>頭だけ</small></button><button id="hard">HARD<br><small>なめらかな長い体</small></button></div><div id="result" hidden></div><button id="start">ゲームスタート</button></div><div id="hint">画面タップ / クリック / スペースキーでジャンプ</div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const panel=document.getElementById('panel'),title=document.getElementById('title'),desc=document.getElementById('desc'),result=document.getElementById('result'),modes=document.getElementById('modes'),start=document.getElementById('start'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),hint=document.getElementById('hint');let W=0,H=0,dpr=1,mode='easy',state='menu',world=0,score=0,best=0,headY=0,vel=0,last=0,trail=[],samples=[],time=0,flash=0;const SPEED=175,STEP=8,HEAD_X=.27,BODY_LENGTH=360,BODY_SPACING=3;function key(){return 'nyoronyoro-best-'+mode}function readBest(){try{return Number(localStorage.getItem(key()))||0}catch{return 0}}function writeBest(n){try{localStorage.setItem(key(),String(n))}catch{}}function updateBest(){best=readBest();bestEl.innerHTML='BEST '+mode.toUpperCase()+'<br>'+best+' m'}function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(state!=='playing'){headY=H*.5;generate()}}addEventListener('resize',resize);function select(m){mode=m;document.getElementById('easy').classList.toggle('selected',m==='easy');document.getElementById('hard').classList.toggle('selected',m==='hard');updateBest();generate()}document.getElementById('easy').onclick=()=>select('easy');document.getElementById('hard').onclick=()=>select('hard');function corridor(x){const difficulty=Math.min(world/3500,1);const gap=(mode==='easy'?Math.min(H*.43,300):Math.min(H*.37,250))*(1-.36*difficulty);const wave=H*(.13+.035*difficulty);const center=H*.52+Math.sin(x/230)*wave+Math.sin(x/101+1.2)*wave*.27;return {top:Math.max(28,center-gap/2),bottom:Math.min(H-28,center+gap/2)}}function generate(){samples=[];for(let x=0;x<=W+STEP;x+=STEP)samples.push(corridor(world+x))}function begin(){state='playing';world=0;score=0;vel=0;time=0;flash=0;headY=(corridor(W*HEAD_X).top+corridor(W*HEAD_X).bottom)/2;trail=[];for(let x=0;x>=-BODY_LENGTH-18;x-=BODY_SPACING)trail.push({x,y:headY});scoreEl.textContent='0 m';updateBest();panel.hidden=true;hint.hidden=false;generate();last=performance.now()}function end(){state='over';flash=1;const n=Math.floor(score);if(n>best){best=n;writeBest(n)}updateBest();title.innerHTML='ゲームオーバー';desc.innerHTML=mode==='hard'?'頭だけでなく、体も壁に触れないように！':'連打のリズムをつかんでもう一度！';result.hidden=false;result.textContent=n+' m';modes.style.display='flex';start.textContent='もう一度挑戦';panel.hidden=false;hint.hidden=true}start.onclick=begin;function tap(){if(state!=='playing')return;vel=Math.max(vel-275,-410)}addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('#panel'))return;e.preventDefault();tap()},{passive:false});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)tap()}});function smoothBodyY(i){
  // Distance-based smoothing: head reacts immediately, body bends gradually.
  if(i<=0)return headY;
  const p=trail[i];if(!p)return headY;
  let sum=0,weight=0;
  const radius=54;
  for(let j=Math.max(0,i-30);j<=Math.min(trail.length-1,i+30);j++){
    const d=(trail[j].x-p.x)/radius;
    const w=Math.exp(-2*d*d);
    sum+=trail[j].y*w;weight+=w;
  }
  const filtered=weight?sum/weight:p.y;
  // A gradual transition over the neck prevents a sudden kink on tap.
  const distance=world-p.x;
  const neck=Math.min(1,Math.max(0,distance/58));
  const eased=neck*neck*(3-2*neck);
  return headY*(1-eased)+filtered*eased;
}
function update(dt){time+=dt;world+=SPEED*dt;score=world/12;scoreEl.textContent=Math.floor(score)+' m';vel=Math.min(vel+(vel<0?350:220)*dt,260);headY+=vel*dt;generate();const hx=W*HEAD_X;// Keep body samples at fixed world-distance intervals, independent of frame rate.
const prev=trail[0];
if(prev){
  // Keep one sample every BODY_SPACING world units. Never overwrite an old
  // sample with a new head position: doing so made the body snap on clicks.
  const lastSampleX=prev.x;
  const lastSampleY=prev.y;
  const distance=world-lastSampleX;
  if(distance>=BODY_SPACING){
    const count=Math.floor(distance/BODY_SPACING);
    for(let k=1;k<=count;k++){
      const x=lastSampleX+k*BODY_SPACING;
      const t=(x-lastSampleX)/distance;
      trail.unshift({x,y:lastSampleY+(headY-lastSampleY)*t});
    }
  }
}
while(trail.length>2&&trail[trail.length-1].x<world-BODY_LENGTH-18)trail.pop();
const r=mode==='easy'?9:8;const c=corridor(world+hx);if(time>.65&&(headY-r<c.top||headY+r>c.bottom)){end();return}if(mode==='hard'&&time>1.5){for(let i=3;i<trail.length;i+=3){const p=trail[i],tx=hx+p.x-world;if(tx<0)continue;const wall=corridor(p.x+hx);const radius=Math.max(3,8-(world-p.x)/BODY_LENGTH*5);const sy=smoothBodyY(i);if(sy-radius<wall.top||sy+radius>wall.bottom){end();return}}}}function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c1d35');bg.addColorStop(1,'#11162c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#6ee7f9';for(let i=0;i<28;i++){const x=((i*173-world*.13)%(W+120)+(W+120))%(W+120),y=(i*97)%Math.max(1,H);ctx.fillRect(x,y,2,2)}ctx.restore();generate();ctx.beginPath();ctx.moveTo(0,0);for(let x=0;x<=W+STEP;x+=STEP)ctx.lineTo(x,corridor(world+x).top);ctx.lineTo(W,0);ctx.closePath();ctx.fillStyle='#253d50';ctx.fill();ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+STEP;x+=STEP)ctx.lineTo(x,corridor(world+x).bottom);ctx.lineTo(W,H);ctx.closePath();ctx.fill();for(const side of ['top','bottom']){ctx.beginPath();for(let x=0;x<=W+STEP;x+=STEP){const y=corridor(world+x)[side];if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle=side==='top'?'#54c8bf':'#59d2c5';ctx.lineWidth=4;ctx.shadowColor='#38bdf8';ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0}const hx=W*HEAD_X;if(mode==='hard'&&trail.length>1){ctx.lineCap='round';ctx.lineJoin='round';for(let i=trail.length-1;i>=1;i--){const p=trail[i],q=trail[i-1],progress=Math.min(1,(world-p.x)/BODY_LENGTH);ctx.beginPath();ctx.moveTo(hx+p.x-world,smoothBodyY(i));ctx.lineTo(hx+q.x-world,smoothBodyY(i-1));ctx.strokeStyle=`hsl(${164+progress*24} 78% ${65-progress*22}%)`;ctx.lineWidth=5+12*(1-progress);ctx.stroke()}ctx.beginPath();ctx.moveTo(hx,smoothBodyY(0));ctx.quadraticCurveTo(hx-2,(smoothBodyY(0)+headY)/2,hx,headY);ctx.strokeStyle='#6ee7c0';ctx.lineWidth=16;ctx.stroke()}ctx.beginPath();ctx.arc(hx,headY,mode==='easy'?9:11,0,Math.PI*2);ctx.fillStyle='#facc15';ctx.shadowColor='#fbbf24';ctx.shadowBlur=19;ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(hx+3,headY-3,2.2,0,Math.PI*2);ctx.fillStyle='#132132';ctx.fill();if(flash>0){ctx.fillStyle='rgba(251,113,133,.13)';ctx.fillRect(0,0,W,H);flash*=.9}}function frame(now){let dt=Math.min((now-last)/1000||0,.034);last=now;if(state==='playing')update(dt);draw();requestAnimationFrame(frame)}resize();updateBest();requestAnimationFrame(frame)})();
</script></body></html>
